<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>S2 v3 — Pivot Table</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
    h2 { margin: 16px; font-size: 16px; color: #333; }
    #app { width: calc(100vw - 32px); height: calc(100vh - 60px); margin: 0 16px; background: #fff; border: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <h2>S2 v3 — 透视表 (Pivot Table)</h2>
  <div id="app"></div>
  <script type="module">
    import { createWorkbook, PivotModule, mountCanvas } from '../packages/s2/src/index.ts';

    const workbook = createWorkbook({ modules: [PivotModule] });

    // 注册数据源
    workbook.registerDataSource('sales', [
      { province: '浙江', city: '杭州', type: '纸张', price: 20 },
      { province: '浙江', city: '杭州', type: '纸张', price: 30 },
      { province: '浙江', city: '杭州', type: '笔', price: 15 },
      { province: '浙江', city: '宁波', type: '纸张', price: 25 },
      { province: '浙江', city: '宁波', type: '笔', price: 10 },
      { province: '江苏', city: '南京', type: '纸张', price: 40 },
      { province: '江苏', city: '南京', type: '笔', price: 20 },
      { province: '江苏', city: '苏州', type: '纸张', price: 35 },
      { province: '江苏', city: '苏州', type: '笔', price: 18 },
      { province: '广东', city: '广州', type: '纸张', price: 22 },
      { province: '广东', city: '广州', type: '笔', price: 12 },
      { province: '广东', city: '深圳', type: '纸张', price: 28 },
      { province: '广东', city: '深圳', type: '笔', price: 16 },
    ]);

    // 配置透视表
    workbook.apply([{
      type: 'pivot.setConfig',
      payload: {
        sheet: 0,
        dataSourceId: 'sales',
        rows: ['province', 'city'],
        columns: ['type'],
        values: ['price'],
        valueAggregation: { price: 'SUM' },
      },
    }]);

    mountCanvas(workbook, document.getElementById('app'));
  </script>
</body>
</html>
