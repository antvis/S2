<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>分组展示</title>
  <style>
    body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 4px; color: #333; font-size: 14px; }
    p { margin: 0 0 12px; color: #666; font-size: 13px; }
    #container { width: 800px; height: 500px; border: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <h3>分组展示 — 按部门分组</h3>
  <p>使用 groupBy: ['dept'] 将扁平数据自动按部门分组，支持折叠/展开</p>
  <div id="container"></div>
  <script type="module">
    import { createWorkbook, ListTableModule, mountCanvas } from '../../packages/s2/src/index.ts';

    const DATA = [
      { name: '张三', dept: '技术部', level: '高级', salary: 25000 },
      { name: '李四', dept: '技术部', level: '中级', salary: 18000 },
      { name: '王五', dept: '技术部', level: '初级', salary: 12000 },
      { name: '赵六', dept: '产品部', level: '高级', salary: 22000 },
      { name: '孙七', dept: '产品部', level: '中级', salary: 16000 },
      { name: '周八', dept: '市场部', level: '高级', salary: 20000 },
      { name: '吴九', dept: '市场部', level: '中级', salary: 15000 },
      { name: '郑十', dept: '市场部', level: '初级', salary: 10000 },
    ];

    const workbook = createWorkbook({ modules: [ListTableModule] });
    workbook.registerDataSource('employees', DATA);

    workbook.apply([{
      type: 'list.setConfig',
      payload: {
        sheet: 0,
        dataSourceId: 'employees',
        columns: [
          { field: 'dept', title: '部门' },
          { field: 'name', title: '姓名' },
          { field: 'level', title: '级别' },
          { field: 'salary', title: '薪资' },
        ],
        groupBy: ['dept'],
      },
    }]);

    mountCanvas(workbook, document.getElementById('container'));
  </script>
</body>
</html>
