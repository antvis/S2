<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>树形展示</title>
  <style>
    body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 4px; color: #333; font-size: 14px; }
    p { margin: 0 0 12px; color: #666; font-size: 13px; }
    #container { width: 800px; height: 500px; border: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <h3>树形展示 — 组织架构树</h3>
  <p>使用嵌套 children 数据展示组织架构，department 列设置 tree: true</p>
  <div id="container"></div>
  <script type="module">
    import { createWorkbook, ListTableModule, mountCanvas } from '../../packages/s2/src/index.ts';

    const DATA = [
      {
        department: '技术中心',
        head: '张总',
        headcount: 120,
        children: [
          {
            department: '前端组',
            head: '李主管',
            headcount: 40,
            children: [
              { department: 'S2 团队', head: '王工', headcount: 8 },
              { department: 'G2 团队', head: '赵工', headcount: 10 },
              { department: '基础设施', head: '孙工', headcount: 22 },
            ],
          },
          {
            department: '后端组',
            head: '周主管',
            headcount: 50,
            children: [
              { department: '交易', head: '吴工', headcount: 20 },
              { department: '支付', head: '郑工', headcount: 30 },
            ],
          },
          { department: '测试组', head: '陈主管', headcount: 30 },
        ],
      },
      {
        department: '产品中心',
        head: '林总',
        headcount: 35,
        children: [
          { department: 'B 端产品', head: '黄经理', headcount: 15 },
          { department: 'C 端产品', head: '刘经理', headcount: 20 },
        ],
      },
    ];

    const workbook = createWorkbook({ modules: [ListTableModule] });
    workbook.registerDataSource('org', DATA);

    workbook.apply([{
      type: 'list.setConfig',
      payload: {
        sheet: 0,
        dataSourceId: 'org',
        columns: [
          { field: 'department', title: '部门', tree: true },
          { field: 'head', title: '负责人' },
          { field: 'headcount', title: '人数' },
        ],
      },
    }]);

    mountCanvas(workbook, document.getElementById('container'));
  </script>
</body>
</html>
