<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>S2 v3 — Full Pivot Table</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
    h2 { margin: 16px; font-size: 16px; color: #333; }
    #app { width: calc(100vw - 32px); height: calc(100vh - 60px); margin: 0 16px; background: #fff; border: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <h2>S2 v3 — 完整透视表 (Full Pivot Table)</h2>
  <div id="app"></div>
  <script type="module">
    import { createWorkbook, PivotModule, mountCanvas } from '../packages/s2/src/index.ts';

    const workbook = createWorkbook({ modules: [PivotModule] });

    // 加载远程数据
    const res = await fetch('https://assets.antv.antgroup.com/s2/en-data-config.json');
    const config = await res.json();

    workbook.registerDataSource('main', config.data);

    workbook.apply([{
      type: 'pivot.setConfig',
      payload: {
        sheet: 0,
        dataSourceId: 'main',
        rows: config.fields.rows,
        columns: config.fields.columns,
        values: config.fields.values,
        valueAggregation: Object.fromEntries(config.fields.values.map(v => [v, 'SUM'])),
      },
    }]);

    mountCanvas(workbook, document.getElementById('app'), {
      width: 800,
      height: 400,
    });

    window.workbook = workbook;
    console.log('Config:', config.fields);
  </script>
</body>
</html>
