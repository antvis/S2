<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>自动填充</title>
  <style>
    body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 4px; color: #333; font-size: 14px; }
    p { margin: 0 0 12px; color: #666; font-size: 13px; }
    #container { width: 800px; height: 500px;  }
  </style>
</head>
<body>
  <h3>自动填充 — 拖拽填充柄</h3>
  <p>选中单元格后，拖拽右下角的填充柄向下或向右填充</p>
  <div id="container"></div>
  <script type="module">
    import { createWorkbook, EditModule, mountCanvas } from '../../packages/s2/src/index.ts';

    const workbook = createWorkbook({ modules: [EditModule] });

    const ops = [];
    ops.push({ type: 'setCellValue', payload: { sheet: 0, row: 0, col: 0, value: '序号' } });
    ops.push({ type: 'setCellValue', payload: { sheet: 0, row: 0, col: 1, value: '数据' } });
    for (let r = 1; r <= 5; r++) {
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r, col: 0, value: r } });
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r, col: 1, value: r * 10 } });
    }
    workbook.apply(ops);

    mountCanvas(workbook, document.getElementById('container'));
  </script>
</body>
</html>
