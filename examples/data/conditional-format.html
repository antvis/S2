<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>条件格式</title>
  <style>
    body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 4px; color: #333; font-size: 14px; }
    p { margin: 0 0 12px; color: #666; font-size: 13px; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; }
    .toolbar button { padding: 4px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
    #container { width: 800px; height: 500px;  }
  </style>
</head>
<body>
  <h3>条件格式 — 高亮 / 色阶</h3>
  <p>对评分列应用条件格式规则</p>
  <div class="toolbar">
    <button id="btn-red">评分 &gt; 80 标红</button>
    <button id="btn-scale">色阶</button>
    <button id="btn-clear">清除</button>
  </div>
  <div id="container"></div>
  <script type="module">
    import { createWorkbook, ConditionalFormatModule, mountCanvas } from '../../packages/s2/src/index.ts';

    const workbook = createWorkbook({ modules: [ConditionalFormatModule] });

    const headers = ['姓名', '部门', '评分'];
    const ops = [];
    for (let c = 0; c < headers.length; c++) {
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: 0, col: c, value: headers[c] } });
    }
    for (let r = 0; r < 20; r++) {
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 0, value: `员工${r + 1}` } });
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 1, value: ['工程', '产品', '设计', '运营'][r % 4] } });
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 2, value: Math.round(50 + Math.random() * 50) } });
    }
    workbook.apply(ops);

    document.getElementById('btn-red').onclick = () =>
      workbook.apply([{
        type: 'conditionalFormat.addRule',
        payload: {
          sheet: 0,
          range: { startRow: 1, endRow: 20, startCol: 2, endCol: 2 },
          rule: { type: 'greaterThan', value: 80 },
          style: { backgroundColor: '#ff4d4f', color: '#fff' },
        },
      }]);

    document.getElementById('btn-scale').onclick = () =>
      workbook.apply([{
        type: 'conditionalFormat.addRule',
        payload: {
          sheet: 0,
          range: { startRow: 1, endRow: 20, startCol: 2, endCol: 2 },
          rule: { type: 'colorScale', min: '#ffffff', max: '#1890ff' },
        },
      }]);

    document.getElementById('btn-clear').onclick = () =>
      workbook.apply([{ type: 'conditionalFormat.clearRules', payload: { sheet: 0 } }]);

    mountCanvas(workbook, document.getElementById('container'));
  </script>
</body>
</html>
