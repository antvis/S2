<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>过滤</title>
  <style>
    body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 4px; color: #333; font-size: 14px; }
    p { margin: 0 0 12px; color: #666; font-size: 13px; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar button { padding: 4px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
    .toolbar input { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 80px; }
    #container { width: 800px; height: 500px;  }
  </style>
</head>
<body>
  <h3>过滤 — 按评分过滤</h3>
  <p>输入阈值，过滤评分大于该值的行</p>
  <div class="toolbar">
    <span>评分 &gt;</span>
    <input id="inp-val" type="number" value="70">
    <button id="btn-filter">过滤</button>
    <button id="btn-clear">清除</button>
  </div>
  <div id="container"></div>
  <script type="module">
    import { createWorkbook, FilterModule, mountCanvas } from '../../packages/s2/src/index.ts';

    const workbook = createWorkbook({ modules: [FilterModule] });

    const headers = ['姓名', '部门', '评分'];
    const ops = [];
    for (let c = 0; c < headers.length; c++) {
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: 0, col: c, value: headers[c] } });
    }
    const names = ['张三', '李四', '王五', '赵六', '孙七', '周八', '吴九', '郑十'];
    const depts = ['工程', '产品', '设计', '运营'];
    for (let r = 0; r < 30; r++) {
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 0, value: names[r % names.length] } });
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 1, value: depts[r % depts.length] } });
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 2, value: Math.round(40 + Math.random() * 60) } });
    }
    workbook.apply(ops);

    document.getElementById('btn-filter').onclick = () => {
      const val = Number(document.getElementById('inp-val').value);
      workbook.apply([{ type: 'filter.set', payload: { sheet: 0, col: 2, condition: { type: 'greaterThan', value: val } } }]);
    };
    document.getElementById('btn-clear').onclick = () =>
      workbook.apply([{ type: 'filter.clear', payload: { sheet: 0 } }]);

    mountCanvas(workbook, document.getElementById('container'));
  </script>
</body>
</html>
