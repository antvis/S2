<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>数据格式化</title>
  <style>
    body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 4px; color: #333; font-size: 14px; }
    p { margin: 0 0 12px; color: #666; font-size: 13px; }
    .toolbar { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .toolbar button { padding: 4px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
    .toolbar button:hover { background: #f5f5f5; }
    #container { width: 800px; height: 500px; }
  </style>
</head>
<body>
  <h3>数据格式化 — 数字 / 货币 / 百分比 / 日期 / 多段格式</h3>
  <p>对金额列、占比列、日期列应用 Excel 兼容格式串或结构化预设。注册 FormatModule 后 getCellDisplayValue 自动格式化。</p>
  <div class="toolbar">
    <button id="btn-number">千分位数字</button>
    <button id="btn-currency">货币 ¥</button>
    <button id="btn-percent">百分比</button>
    <button id="btn-date">写入日期 (autoFormat)</button>
    <button id="btn-multisection">多段格式 (负数)</button>
    <button id="btn-clear">清除格式</button>
    <button id="btn-undo">撤销</button>
  </div>
  <div id="container"></div>
  <script type="module">
    import { createWorkbook, FormatModule, EditModule, mountCanvas } from '../../packages/s2/src/index.ts';

    const workbook = createWorkbook({ modules: [FormatModule, EditModule], locale: 'zh-CN' });

    // 表头 + 样本数据:金额(数字)、占比(0~1 小数)、日期列先空着
    const headers = ['项目', '金额', '占比', '日期'];
    const projects = ['项目A', '项目B', '项目C', '项目D', '项目E'];
    const amounts = [1234.5, -5678.9, 100, 999999.99, 42];
    const ratios = [0.523, 0.87, 0.123, 1, 0.333];

    const ops = [];
    for (let c = 0; c < headers.length; c++) {
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: 0, col: c, value: headers[c] } });
    }
    for (let r = 0; r < projects.length; r++) {
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 0, value: projects[r] } });
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 1, value: amounts[r] } });
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: r + 1, col: 2, value: ratios[r] } });
    }
    workbook.apply(ops);

    const amountRange = { startRow: 1, endRow: 5, startCol: 1, endCol: 1 };
    const ratioRange = { startRow: 1, endRow: 5, startCol: 2, endCol: 2 };
    const dateRange = { startRow: 1, endRow: 5, startCol: 3, endCol: 3 };

    // 千分位数字:结构化预设 -> pattern '#,##0.00'
    document.getElementById('btn-number').onclick = () =>
      workbook.apply([{
        type: 'format.setPreset',
        payload: { sheet: 0, range: amountRange, preset: { kind: 'number', decimal: 2, group: true } },
      }]);

    // 货币:预设 -> pattern '¥#,##0.00'
    document.getElementById('btn-currency').onclick = () =>
      workbook.apply([{
        type: 'format.setPreset',
        payload: { sheet: 0, range: amountRange, preset: { kind: 'currency', decimal: 2, symbol: '¥' } },
      }]);

    // 百分比:预设 -> pattern '0.0%'
    document.getElementById('btn-percent').onclick = () =>
      workbook.apply([{
        type: 'format.setPreset',
        payload: { sheet: 0, range: ratioRange, preset: { kind: 'percent', decimal: 1 } },
      }]);

    // 日期:autoFormat=true 传 Date 实例,引擎自动转 Excel serial + 存 yyyy-mm-dd
    document.getElementById('btn-date').onclick = () => {
      const dateOps = [];
      for (let r = 0; r < 5; r++) {
        dateOps.push({
          type: 'setCellValue',
          payload: { sheet: 0, row: r + 1, col: 3, value: new Date(2023, r, 15), autoFormat: true },
        });
      }
      workbook.apply(dateOps);
    };

    // 多段格式:正数正常,负数走第二段(颜色渲染是 Phase 2,这里演示文本分段)
    document.getElementById('btn-multisection').onclick = () =>
      workbook.apply([{
        type: 'format.setPattern',
        payload: { sheet: 0, range: amountRange, pattern: '#,##0.00;[Red]-#,##0.00' },
      }]);

    document.getElementById('btn-clear').onclick = () =>
      workbook.apply([{ type: 'format.clear', payload: { sheet: 0, range: { startRow: 1, endRow: 5, startCol: 1, endCol: 3 } } }]);

    document.getElementById('btn-undo').onclick = () => workbook.undo();

    mountCanvas(workbook, document.getElementById('container'));
  </script>
</body>
</html>
