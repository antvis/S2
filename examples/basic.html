<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>S2 v3 — Basic Example</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #app { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createWorkbook, mountCanvas } from '../packages/s2/src/index.ts';

    const workbook = createWorkbook();

    // 填入 200 行 × 10 列数据
    const ops = [];
    for (let row = 0; row < 200; row++) {
      for (let col = 0; col < 10; col++) {
        ops.push({ type: 'setCellValue', payload: { sheet: 0, row, col, value: `R${row}C${col}` } });
      }
    }
    workbook.apply(ops);

    mountCanvas(workbook, document.getElementById('app'));
  </script>
</body>
</html>
