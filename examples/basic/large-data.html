<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>大数据量</title>
  <style>
    body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 4px; color: #333; font-size: 14px; }
    p { margin: 0 0 12px; color: #666; font-size: 13px; }
    #container { width: 800px; height: 500px; border: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <h3>大数据量 — 10,000 行 × 20 列</h3>
  <p id="info">加载中...</p>
  <div id="container"></div>
  <script type="module">
    import { createWorkbook, mountCanvas } from '../../packages/s2/src/index.ts';

    const ROWS = 10000;
    const COLS = 20;
    const workbook = createWorkbook();

    const t0 = performance.now();
    const ops = [];
    for (let col = 0; col < COLS; col++) {
      ops.push({ type: 'setCellValue', payload: { sheet: 0, row: 0, col, value: `Col${col}` } });
    }
    for (let row = 1; row <= ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        ops.push({ type: 'setCellValue', payload: { sheet: 0, row, col, value: row * COLS + col } });
      }
    }
    workbook.apply(ops);
    const t1 = performance.now();

    mountCanvas(workbook, document.getElementById('container'));

    document.getElementById('info').textContent =
      `${ROWS.toLocaleString()} 行 × ${COLS} 列，数据填充耗时 ${(t1 - t0).toFixed(0)}ms`;
  </script>
</body>
</html>
